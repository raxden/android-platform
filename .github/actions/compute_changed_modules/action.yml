name: Compute changed modules
description: Detects changed Gradle modules from settings.gradle.kts and returns a JSON array for a GitHub Actions matrix.

inputs:
  modules:
    description: "Optional JSON array override or 'all' to include all modules"
    required: false
    default: ""

outputs:
  value:
    description: "JSON array of Gradle module paths that changed"
    value: ${{ steps.resolve.outputs.value }}

  hasModules:
    description: "true when at least one module was detected"
    value: ${{ steps.resolve.outputs.hasModules }}

runs:
  using: composite
  steps:
    - name: Extract modules from settings.gradle.kts
      id: extract_modules
      shell: bash
      run: |
        set -euo pipefail

        modules=$(grep -E '^[[:space:]]*include\(":' settings.gradle.kts \
          | sed -E 's|^[[:space:]]*include\("([^"]+)"\).*|\1|' \
          | jq -R . \
          | jq -s -c .)

        echo "modules=$modules" >> "$GITHUB_OUTPUT"

    - name: Detect changed files
      id: changed
      if: ${{ inputs.modules == '' }}
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_FORCED: ${{ github.event.forced }}
      run: |
        set -euo pipefail

        # Changed files = added, copied, modified, renamed (new path); no
        # deletions. Plain git; requires a full-history checkout
        # (fetch-depth: 0).
        zero_sha="0000000000000000000000000000000000000000"

        emit() {
          local any="$1" files="$2" delim
          delim="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "any_changed=$any"
            echo "all_changed_files<<${delim}"
            printf '%s\n' "$files"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"
        }

        parent_sha() {
          git rev-parse --verify --quiet 'HEAD^{commit}^' 2>/dev/null || true
        }

        current_sha=$(git rev-parse HEAD)

        if [[ -n "$PR_BASE_REF" ]]; then
          # Pull request: PR base...PR head (merge base to head).
          echo "Running on a $EVENT_NAME event..."
          previous="$PR_BASE_SHA"
          current="$PR_HEAD_SHA"
          if [[ -z "$current" ]] || ! git cat-file -e "${current}^{commit}" 2>/dev/null; then
            current="$current_sha"
          fi
          if [[ -z "$previous" ]] || ! git cat-file -e "${previous}^{commit}" 2>/dev/null; then
            echo "::error::Pull request base commit '$previous' is not in the local history. Use actions/checkout with fetch-depth: 0."
            exit 1
          fi
          range="${previous}...${current}"
        else
          # Push / workflow_dispatch / others: previous remote commit..HEAD,
          # falling back to the parent commit.
          echo "Running on a ${EVENT_NAME:-push} event..."
          previous=""
          if [[ "$PUSH_FORCED" != "true" ]]; then
            previous="$PUSH_BEFORE"
          fi

          if [[ -z "$previous" || "$previous" == "$zero_sha" ]]; then
            previous=$(parent_sha)
          elif ! git cat-file -e "${previous}^{commit}" 2>/dev/null; then
            echo "::warning::Previous commit $previous is not valid. Using parent commit."
            previous=$(parent_sha)
          fi

          if [[ -z "$previous" || "$previous" == "$current_sha" ]]; then
            previous=$(parent_sha)
          fi

          if [[ -z "$previous" ]]; then
            if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
              echo "::error::Unable to locate the previous commit in a shallow clone. Use actions/checkout with fetch-depth: 0."
              exit 1
            fi
            echo "Initial commit detected, no previous commit found."
            emit false ""
            exit 0
          fi

          current="$current_sha"
          range="${previous}..${current}"
        fi

        echo "Retrieving changes for $range"

        if ! files=$(git -c core.quotepath=off diff --name-only -M \
              --ignore-submodules=all --diff-filter=ACMR "$range" --); then
          echo "::error::Unable to determine the changed files for $range."
          exit 1
        fi

        if [[ -n "$files" ]]; then
          emit true "$files"
        else
          emit false ""
        fi

    - name: Resolve modules
      id: resolve
      shell: bash
      env:
        INPUT_MODULES: ${{ inputs.modules }}
        ALL_MODULES: ${{ steps.extract_modules.outputs.modules }}
        ANY_CHANGED: ${{ steps.changed.outputs.any_changed }}
        CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
      run: |
        set -euo pipefail

        if [[ -n "$INPUT_MODULES" ]]; then
          if [[ "$INPUT_MODULES" == "all" ]]; then
            modules="$ALL_MODULES"
          else
            modules="$INPUT_MODULES"
            echo "$modules" | jq empty
          fi
        else
          if [[ "$ANY_CHANGED" != "true" ]]; then
            modules="[]"
          else
            module_list=()
            while IFS= read -r module; do
              module_list+=("$module")
            done < <(echo "$ALL_MODULES" | jq -r '.[]')

            modules=$(printf '%s\n' "$CHANGED_FILES" | while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              for module in "${module_list[@]}"; do
                path="${module#:}"
                path="${path//://}"

                if [[ "$file" == "$path/"* ]]; then
                  echo "$module"
                fi
              done
            done | sort -u | jq -R . | jq -s -c .)
          fi
        fi

        hasModules=$(echo "$modules" | jq 'length > 0')

        echo "Modules JSON: $modules"
        echo "value=$modules" >> "$GITHUB_OUTPUT"
        echo "hasModules=$hasModules" >> "$GITHUB_OUTPUT"

    - name: Write modules to job summary
      shell: bash
      env:
        MATRIX: ${{ steps.resolve.outputs.value }}
        INPUT_MODULES: ${{ inputs.modules }}
      run: |
        set -euo pipefail

        matrix="$MATRIX"
        count=$(echo "$matrix" | jq 'length')
        input_modules="$INPUT_MODULES"

        {
          if [[ "$input_modules" == "all" ]]; then
            echo "## 🔍 All Modules Selected"
            echo ""
            echo "🧩 **Total modules:** $count"
          else
            echo "## 🔍 Modules with Changes"
            echo ""
            if [[ "$count" -eq 0 ]]; then
              echo "✅ **No modules changed**"
            else
              echo "🧩 **Modules affected:** $count"
            fi
          fi

          echo ""

          if [[ "$count" -gt 0 ]]; then
            echo "### 📦 Modules"
            echo ""
            echo "$matrix" | jq -r '.[] | "- `\(.)`"'
            echo ""
          fi

          echo "---"
          echo "_Generated by compute_changed_modules_"
        } >> "$GITHUB_STEP_SUMMARY"