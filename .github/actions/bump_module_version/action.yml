name: 'Bump modules version'
description: 'Increments the version of one or more Gradle modules (patch/minor/major), commits each change individually and optionally pushes the result to origin'

inputs:
  modules:
    description: 'JSON array of Gradle module paths to bump (e.g. [":libraries:core", ":bom"])'
    required: true

  version:
    description: 'Version component to increment: patch, minor or major'
    required: false
    default: 'patch'

  push:
    description: 'Push commits (and tags) to origin after bumping (true/false)'
    required: false
    default: 'true'

  git-user-name:
    description: 'Git commit author name'
    required: true

  git-user-email:
    description: 'Git commit author email'
    required: true

  git-branch:
    description: 'Remote branch to rebase against and push to'
    required: true

  git-create-tag:
    description: 'Create a Git tag for each bumped version (true/false). Tags are created and pushed atomically with the branch, only when push is true'
    required: false
    default: 'false'

outputs:
  versions:
    description: 'JSON array of bumped modules: [{"module":":x","from":"1.0.0","to":"1.0.1"}]. Empty array when nothing was bumped'
    value: ${{ steps.bump_modules.outputs.versions }}
  new-version:
    description: 'Version of the last bumped module (empty when nothing was bumped)'
    value: ${{ steps.bump_modules.outputs.new-version }}
  committed:
    description: 'true when at least one bump commit was created'
    value: ${{ steps.bump_modules.outputs.committed }}

runs:
  using: 'composite'
  steps:

    - name: Git config + sync branch
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "${{ inputs.git-user-name }}"
        git config user.email "${{ inputs.git-user-email }}"
        git pull --rebase origin "${{ inputs.git-branch }}"

    - name: Bump modules and commit one by one
      id: bump_modules
      shell: bash
      run: |
        set -euo pipefail

        case "${{ inputs.version }}" in
          patch) task=increasePatchVersion ;;
          minor) task=increaseMinorVersion ;;
          major) task=increaseMajorVersion ;;
          *) echo "version must be patch|minor|major"; exit 1 ;;
        esac

        rm -f "$RUNNER_TEMP/bump_tags.tsv"
        committed=false
        bump_type="${{ inputs.version }}"
        versions_json="[]"
        new_version=""
        modules_json='${{ inputs.modules }}'

        if [[ -z "$modules_json" || "$modules_json" == "[]" ]]; then
          echo "No modules received"
        else

          mapfile -t modules < <(echo "$modules_json" | jq -r '.[]')

          for module in "${modules[@]}"; do

            echo "::group::Bump $module"

            from=$(./gradlew -q "$module:getVersion" | tail -n 1)

            ./gradlew "$module:$task" --no-configuration-cache

            if git diff --quiet; then
              echo "No changes detected for $module"
              echo "::endgroup::"
              continue
            fi

            version=$(./gradlew -q "$module:getVersion" | tail -n 1)

            git add .
            git commit -m "Bump $module version to $version [skip ci]"

            # Tags are created in the push step, after the final rebase, so they
            # always point at the commit that actually lands on the branch.
            if [[ "${{ inputs.git-create-tag }}" == "true" ]]; then
              if [[ ! "$version" =~ ^[0-9A-Za-z._-]+$ ]]; then
                echo "::error::Unexpected version string for tag: $version"
                exit 1
              fi
              printf '%s\t%s\n' "$version" "Bump $module version to $version [skip ci]" >> "$RUNNER_TEMP/bump_tags.tsv"
            fi

            committed=true

            versions_json=$(jq -c --arg m "$module" --arg f "$from" --arg t "$version" \
              '. + [{module: $m, from: $f, to: $t}]' <<< "$versions_json")
            new_version="$version"

            echo "::endgroup::"
            echo "::notice title=Version bump::$module $from → $version ($bump_type)"

          done

        fi

        if [[ "$versions_json" != "[]" ]]; then
          {
            echo "## 🔖 Version bump"
            echo ""
            echo "| Module | From | To | Bump type |"
            echo "|---|---|---|---|"
            jq -r --arg type "$bump_type" '.[] | "| `\(.module)` | `\(.from)` | `\(.to)` | \($type) |"' <<< "$versions_json"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        {
          echo "committed=$committed"
          echo "versions=$versions_json"
          echo "new-version=$new_version"
        } >> "$GITHUB_OUTPUT"

    - name: Push changes
      if: inputs.push == 'true' && steps.bump_modules.outputs.committed == 'true'
      # Plain git push: the caller's checkout (ssh-key + persist-credentials) already
      # configured git, so no third-party action needs access to the SSH key.
      # Branch and tags are pushed atomically (all or nothing), so a rejected branch
      # push can never leave an orphan tag on the remote. On rejection (the branch
      # moved) rebase onto the latest remote branch, re-create the tags on the
      # rebased commits and retry. Existing tags are never moved or deleted.
      shell: bash
      env:
        GIT_BRANCH: ${{ inputs.git-branch }}
      run: |
        set -euo pipefail
        tags_file="$RUNNER_TEMP/bump_tags.tsv"
        max_attempts=5

        for attempt in $(seq 1 "$max_attempts"); do
          git pull --rebase origin "$GIT_BRANCH"

          refs=()
          if [[ -s "$tags_file" ]]; then
            while IFS=$'\t' read -r tag subject; do
              if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null 2>&1; then
                echo "::error::Tag ${tag} already exists on origin; refusing to move it. Fix the module version so it does not collide."
                exit 1
              fi
              sha=$(git log -n 1 --format=%H --fixed-strings --grep="$subject" HEAD)
              if [[ -z "$sha" ]]; then
                echo "::error::Bump commit not found for tag ${tag}"
                exit 1
              fi
              git tag -f "$tag" "$sha"
              refs+=("refs/tags/${tag}")
            done < "$tags_file"
          fi

          if git push --atomic origin "HEAD:refs/heads/${GIT_BRANCH}" "${refs[@]}"; then
            exit 0
          fi

          echo "::warning::Push rejected (attempt ${attempt}/${max_attempts}); retrying after rebase"
          sleep $((attempt * 3))
        done

        echo "::error::Could not push after ${max_attempts} attempts"
        exit 1
