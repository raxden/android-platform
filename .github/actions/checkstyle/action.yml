name: 'Static analysis (detekt)'
description: 'Runs Detekt static analysis and uploads the reports as a workflow artifact on failure (or always when upload-on-success is true)'

inputs:
  id:
    description: 'Value used to identify the workflow run'
    required: false
    default: ${{ github.run_number }}

  retention-days:
    description: 'Remove artifacts after N days'
    required: false
    default: '1'

  gradle-args:
    description: 'Extra Gradle arguments'
    required: false
    default: '--configuration-cache'

  upload-on-success:
    description: 'Upload detekt reports even when the job succeeds (true/false)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Detekt
      id: detekt
      shell: bash
      env:
        GRADLE_ARGS: ${{ inputs.gradle-args }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        echo "::group::./gradlew detekt"
        ./gradlew detekt --stacktrace $GRADLE_ARGS
        echo "::endgroup::"

    - name: Upload Detekt reports
      id: upload_reports
      if: failure() || inputs.upload-on-success == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: detekt-reports-${{ inputs.id }}
        path: |
          **/build/reports/detekt/**
          **/build/reports/**/detekt/**
          **/build/reports/detekt.sarif
          **/build/reports/**/detekt.sarif
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}

    - name: Summary
      if: always()
      shell: bash
      env:
        DETEKT_OUTCOME: ${{ steps.detekt.outcome }}
        UPLOAD_ON_SUCCESS: ${{ inputs.upload-on-success }}
        REPORTS_URL: ${{ steps.upload_reports.outputs.artifact-url }}
        REPORTS_ID: ${{ inputs.id }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
      run: |
        status="$DETEKT_OUTCOME"
        show_reports="false"

        if [[ "$status" != "success" || "$UPLOAD_ON_SUCCESS" == "true" ]]; then
          show_reports="true"
        fi

        reports_url="$REPORTS_URL"
        artifacts_fallback="https://github.com/$REPOSITORY/actions/runs/$RUN_ID#artifacts"

        # Issue count: prefer SARIF, fall back to checkstyle-style XML
        issues=$(python3 -I - <<'PY'
        import glob, json
        import xml.etree.ElementTree as ET

        total = None
        for f in sorted(set(glob.glob("**/build/reports/**/detekt*.sarif", recursive=True))):
            try:
                data = json.load(open(f))
            except Exception:
                continue
            total = (total or 0) + sum(len(r.get("results", [])) for r in data.get("runs", []))
        if total is None:
            for f in sorted(set(glob.glob("**/build/reports/**/detekt*.xml", recursive=True))):
                try:
                    root = ET.parse(f).getroot()
                except ET.ParseError:
                    continue
                total = (total or 0) + len(list(root.iter("error")))
        print("" if total is None else total)
        PY
        )

        {
          echo "## Detekt"
          echo ""
          if [[ -n "$issues" ]]; then
            echo "- Result: **$status** — **$issues** issue(s)"
          else
            echo "- Result: **$status**"
          fi
          if [[ "$show_reports" == "true" ]]; then
            if [[ -n "$reports_url" ]]; then
              echo "- Reports: [detekt-reports-$REPORTS_ID]($reports_url)"
            else
              echo "- Reports: [artifacts]($artifacts_fallback)"
            fi
          fi
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
