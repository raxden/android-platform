name: 'Assemble artifacts'
description: 'Assemble artifacts and (optionally) upload outputs to GitHub'

inputs:
  id:
    description: 'Value used to identify the workflow run'
    required: false
    default: ${{ github.run_number }}

  build-type:
    description: 'Build type (Debug/Release/...)'
    required: true

  artifact-type:
    description: 'Artifact type to build: APK, AAB or AAR. Leave empty to auto-detect (AAB when the bundle task exists, AAR otherwise).'
    required: false
    default: ''

  signing-files:
    description: 'Base64-encoded tar.gz archive containing the keystore and signing config files. Extracted to ./config before the build.'
    required: false
    default: ''

  gradle-args:
    description: 'Extra Gradle args'
    required: false
    default: '--configuration-cache'

  upload-files:
    description: 'Upload build outputs as a workflow artifact (true/false)'
    required: false
    default: 'true'

  retention-days:
    description: 'Number of days before the uploaded build artifact is removed'
    required: false
    default: '1'

outputs:
  artifact-name:
    description: 'Name of the uploaded workflow artifact (consumed by download-artifact in deploy jobs)'
    value: build-${{ steps.artifact_type.outputs.artifact }}-${{ inputs.build-type }}-${{ inputs.id }}
  files:
    description: 'Newline-separated list of produced artifact files (AAB/APK/AAR paths relative to the workspace)'
    value: ${{ steps.summary.outputs.files }}

runs:
  using: 'composite'
  steps:
    - name: Decode and extract signing files
      if: inputs.signing-files != ''
      shell: bash
      env:
        SIGNING_FILES: ${{ inputs.signing-files }}
      run: |
        set -euo pipefail
        umask 077
        mkdir -p ./config
        printf '%s' "$SIGNING_FILES" | base64 -d > ./config/signing.tar.gz
        tar xf ./config/signing.tar.gz -C ./config
        rm -f ./config/signing.tar.gz

    - name: Resolve artifact type
      id: artifact_type
      shell: bash
      run: |
        set -euo pipefail

        artifact="${{ inputs.artifact-type }}"

        if [[ -z "$artifact" ]]; then
          bundleTask="bundle${{ inputs.build-type }}"
          echo "Auto-detecting artifact-type via task: ${bundleTask}"

          if ./gradlew tasks --all --console=plain | grep -Eq "^[[:space:]]*${bundleTask}[[:space:]]"; then
            artifact="AAB"   # application
          else
            artifact="AAR"   # library
          fi
        fi

        case "$artifact" in
          APK|AAB|AAR) ;;
          *)
            echo "artifact-type must be APK|AAB|AAR (or empty for auto)"
            exit 1
            ;;
        esac

        echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

    - name: Resolve task + outputs
      id: plan
      shell: bash
      run: |
        set -euo pipefail

        artifact="${{ steps.artifact_type.outputs.artifact }}"

        case "$artifact" in
          AAB)
            task="bundle${{ inputs.build-type }}"
            paths=$'**/build/outputs/bundle/**/*.aab\n**/build/outputs/mapping/**/mapping.txt'
            ;;
          APK)
            task="assemble${{ inputs.build-type }}"
            paths=$'**/build/outputs/apk/**/*.apk\n**/build/outputs/mapping/**/mapping.txt'
            ;;
          AAR)
            task="assemble${{ inputs.build-type }}"
            paths=$'**/build/outputs/aar/**/*.aar\n**/build/outputs/mapping/**/mapping.txt'
            ;;
        esac

        echo "task=$task" >> "$GITHUB_OUTPUT"
        {
          echo "paths<<EOF"
          echo "$paths"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Assemble
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::./gradlew ${{ steps.plan.outputs.task }}"
        # shellcheck disable=SC2086
        ./gradlew "${{ steps.plan.outputs.task }}" --stacktrace ${{ inputs.gradle-args }}
        echo "::endgroup::"

    - name: Upload outputs
      if: always() && inputs.upload-files == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: build-${{ steps.artifact_type.outputs.artifact }}-${{ inputs.build-type }}-${{ inputs.id }}
        path: ${{ steps.plan.outputs.paths }}
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}

    - name: Summary
      id: summary
      if: always()
      shell: bash
      env:
        JOB_STATUS: ${{ job.status }}
        ARTIFACT: ${{ steps.artifact_type.outputs.artifact }}
        BUILD_TYPE: ${{ inputs.build-type }}
        UPLOAD_FILES: ${{ inputs.upload-files }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
        OUTPUT_PATHS: ${{ steps.plan.outputs.paths }}
      run: |
        set -euo pipefail

        case "$ARTIFACT" in
          AAB) dir="bundle"; ext="aab" ;;
          APK) dir="apk"; ext="apk" ;;
          AAR) dir="aar"; ext="aar" ;;
          *) dir=""; ext="" ;;
        esac

        files=""
        if [[ -n "$ext" ]]; then
          files=$(find . -type f -path "*/build/outputs/${dir}/*" -name "*.${ext}" | sed 's#^\./##' | sort)
        fi

        {
          echo "files<<EOF"
          echo "$files"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        human_size() { numfmt --to=iec --suffix=B "$1" 2>/dev/null || echo "$1 B"; }

        {
          echo "## 📦 Assemble"
          echo ""
          if [[ "$JOB_STATUS" == "success" ]]; then
            echo "✅ **${ARTIFACT:-?}** built"
          else
            echo "❌ Build **$JOB_STATUS**"
          fi
          echo ""
          if [[ -n "$files" ]]; then
            echo "| File | Size | SHA256 |"
            echo "|---|---|---|"
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              size=$(human_size "$(wc -c < "$f" | tr -d ' ')")
              sha="—"
              if [[ "$ext" == "aab" ]]; then
                sha="\`$(sha256sum "$f" | cut -d' ' -f1)\`"
              fi
              echo "| \`$(basename "$f")\` | $size | $sha |"
            done <<< "$files"
            echo ""
          fi
          echo "<details><summary>Build details</summary>"
          echo ""
          echo "- Build type: \`$BUILD_TYPE\`"
          echo "- Upload: \`$UPLOAD_FILES\` (retention \`$RETENTION_DAYS\` days)"
          echo ""
          echo '```'
          echo "$OUTPUT_PATHS"
          echo '```'
          echo "</details>"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
