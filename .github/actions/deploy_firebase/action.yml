name: 'Deploy to Firebase App Distribution'
description: 'Deploys an Android build to Firebase App Distribution'

inputs:
  id:
    description: 'Value used to identify the workflow run'
    required: false
    default: ${{ github.run_number }}

  build-type:
    description: 'Build variant to deploy (e.g. Debug, Release, Staging)'
    required: false
    default: "Debug"

  gradle-args:
    description: 'Extra Gradle arguments appended to the appDistributionUpload task'
    required: false
    default: '--configuration-cache --stacktrace'

  artifact-type:
    description: 'Artifact type of the build to download before deploying (APK or AAB)'
    required: false
    default: "APK"

  version-name:
    description: 'Version name of the build (display only: summary and annotation)'
    required: false
    default: ""

  version-code:
    description: 'Version code of the build (display only: summary and annotation)'
    required: false
    default: ""

  service-credentials:
    description: 'Base64-encoded Firebase service account JSON used to authenticate with App Distribution'
    required: true

runs:
  using: "composite"
  steps:
    - name: Recover artifacts needed to deploy
      uses: actions/download-artifact@v8
      with:
        name: build-${{ inputs.artifact-type }}-${{ inputs.build-type }}-${{ inputs.id }}

    - name: Decode service credentials
      shell: bash
      env:
        SERVICE_CREDENTIALS: ${{ inputs.service-credentials }}
      run: |
        set -euo pipefail
        umask 077
        mkdir -p ./config
        printf '%s' "$SERVICE_CREDENTIALS" | base64 -d > ./config/service_firebase_credentials.json
        chmod 600 ./config/service_firebase_credentials.json

    - name: Deploy in Firebase App Distribution
      shell: bash
      run: |
        set -euo pipefail
        task=":app:appDistributionUpload${{ inputs.build-type }}"
        echo "::group::./gradlew $task"
        # shellcheck disable=SC2086
        ./gradlew "$task" ${{ inputs.gradle-args }}
        echo "::endgroup::"

    - name: Summary
      shell: bash
      env:
        VERSION_NAME: ${{ inputs.version-name }}
        VERSION_CODE: ${{ inputs.version-code }}
        BUILD_TYPE: ${{ inputs.build-type }}
        ARTIFACT_TYPE: ${{ inputs.artifact-type }}
      run: |
        set -euo pipefail

        version=""
        if [[ -n "$VERSION_NAME" ]]; then version="$VERSION_NAME"; fi
        if [[ -n "$VERSION_CODE" ]]; then version="$version ($VERSION_CODE)"; fi
        version="${version# }"

        {
          echo "## 🚀 Firebase App Distribution"
          echo ""
          if [[ -n "$version" ]]; then
            echo "✅ Distributed **$version** (\`$BUILD_TYPE\`, $ARTIFACT_TYPE)"
          else
            echo "✅ Distributed \`$BUILD_TYPE\` ($ARTIFACT_TYPE)"
          fi
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

        echo "::notice title=Firebase::Distributed ${version:-$BUILD_TYPE}"
