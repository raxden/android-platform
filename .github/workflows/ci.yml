name: Continuous Integration (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

run-name: "PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.title }}"

concurrency:
  # Ensure only one run per PR is active
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Increment to invalidate Gradle cache when needed
  CACHE_VERSION: 1
  # Increase Gradle heap size to prevent OOM errors in large builds
  GRADLE_OPTS: >
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dkotlin.daemon.jvm.options=-Xmx2g
  # Enable debug for Gradle cache action
  GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: true
  # Artifact retention
  RETENTION_DAYS: 1
  # Build configuration
  BUILD_TYPE: "Debug"

jobs:

  info:
    name: Workflow Information
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: Print workflow information
        uses: ./.github/actions/info

  computeChangedModules:
    name: Compute changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: Compute changed modules
        id: modules
        uses: ./.github/actions/compute_changed_modules

  checkstyle:
    name: Check code style
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - uses: ./.github/actions/setup

      - name: Run Detekt
        uses: ./.github/actions/checkstyle
        with:
          retention-days: ${{ env.RETENTION_DAYS }}

  verify:
    name: ${{ matrix.name }}
    needs: [checkstyle]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A failure cancels the sibling matrix jobs (replaces the old cancel steps)
      fail-fast: true
      matrix:
        include:
          - name: Build
            task: build
          - name: Run Unit Tests
            task: test

    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - uses: ./.github/actions/setup

      - name: Assemble ${{ env.BUILD_TYPE }}
        if: matrix.task == 'build'
        uses: ./.github/actions/assemble
        with:
          build-type: ${{ env.BUILD_TYPE }}
          retention-days: ${{ env.RETENTION_DAYS }}

      - name: Execute unit tests
        if: matrix.task == 'test'
        uses: ./.github/actions/unit_tests
        with:
          build-type: ${{ env.BUILD_TYPE }}
          retention-days: ${{ env.RETENTION_DAYS }}

  status:
    name: Status
    needs: [ verify ]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check dependencies status
        shell: bash
        run: |
          echo "Build and test status: ${{ needs.verify.result }}"

          if [[ "${{ needs.verify.result }}" != "success" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          
          echo "✅ All jobs succeeded"
      
      - name: Final summary
        shell: bash
        run: |
          echo "Workflow completed successfully"